<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Çay Ocağı Veresiye Defteri</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#222}
header{background:#263238;color:#fff;padding:18px 16px}h1{margin:0;font-size:24px}
.container{max-width:900px;margin:auto;padding:16px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.card{background:#fff;border-radius:12px;padding:14px;box-shadow:0 2px 8px #0001}.card b{font-size:22px;display:block;margin-top:5px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}input,button{font-size:16px;padding:11px;border-radius:9px;border:1px solid #ccc}
input{flex:1;min-width:180px}button{border:0;background:#37474f;color:#fff;cursor:pointer}button.green{background:#2e7d32}button.red{background:#c62828}button.light{background:#eceff1;color:#263238}
.list{display:grid;gap:10px}.person{background:#fff;border-radius:12px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 2px 7px #0001}
.name{font-weight:bold;font-size:18px}.debt{font-weight:bold;color:#c62828;margin-top:4px}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{padding:9px}
small{color:#607d8b}.empty{text-align:center;padding:30px;background:#fff;border-radius:12px}
.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.box{background:#fff;border-radius:14px;padding:18px;max-width:500px;width:100%;max-height:90vh;overflow:auto}.box h2{margin-top:0}.row{display:flex;gap:8px;margin:8px 0}.row input{min-width:0}.history{border-top:1px solid #ddd;margin-top:15px;padding-top:10px}.hist{padding:8px 0;border-bottom:1px solid #eee}.plus{color:#c62828}.minus{color:#2e7d32}
@media(max-width:600px){.cards{grid-template-columns:1fr 1fr}.person{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions button{flex:1}}
</style>
</head>
<body>
<header><h1>☕ Çay Ocağı Veresiye Defteri</h1></header>
<div style="background:#fff3cd;color:#5f4500;padding:12px 14px;text-align:center;font-size:14px">📱 Chrome menüsü ⋮ → Ana ekrana ekle ile uygulama gibi kullanabilirsin.</div><div class="container">
<div class="cards">
<div class="card">Müşteri <b id="count">0</b></div>
<div class="card">Toplam Veresiye <b id="total">0 TL</b></div>
<div class="card">Borçlu Kişi <b id="debtor">0</b></div>
</div>
<div class="controls">
<input id="search" placeholder="Müşteri ara...">
<button class="green" onclick="addPerson()">+ Müşteri Ekle</button>
<button class="light" onclick="backup()">Yedek Al</button>
<button class="light" onclick="restore()">Yedek Yükle</button>
<input type="file" id="file" accept=".json" style="display:none" onchange="loadBackup(event)">
</div>
<div id="list" class="list"></div>
</div>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()">
<div class="box">
<h2 id="modalTitle"></h2>
<div><b>Güncel borç: <span id="modalDebt"></span> TL</b></div>
<div class="row"><input id="amount" type="number" min="0" step="0.01" placeholder="Tutar (TL)"></div>
<div class="row">
<button class="green" style="flex:1" onclick="changeDebt(1)">+ Borç Ekle</button>
<button class="red" style="flex:1" onclick="changeDebt(-1)">Ödeme Al</button>
</div>
<div class="row"><button class="light" style="flex:1" onclick="renamePerson()">İsmi Değiştir</button><button class="red" style="flex:1" onclick="deletePerson()">Müşteriyi Sil</button></div>
<div class="history"><b>İşlem geçmişi</b><div id="history"></div></div>
<div class="row"><button class="light" style="flex:1" onclick="closeModal()">Kapat</button></div>
</div>
</div>

<script>
const KEY="cay_ocagi_veresiye_v1";
let data=JSON.parse(localStorage.getItem(KEY)||"[]"), selected=null;
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function money(n){return Number(n).toLocaleString("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2})}
function render(){
 let q=document.getElementById("search").value.toLocaleLowerCase("tr-TR");
 let filtered=data.filter(p=>p.name.toLocaleLowerCase("tr-TR").includes(q));
 document.getElementById("count").textContent=data.length;
 document.getElementById("total").textContent=money(data.reduce((s,p)=>s+p.debt,0))+" TL";
 document.getElementById("debtor").textContent=data.filter(p=>p.debt>0).length;
 let list=document.getElementById("list");
 list.innerHTML=filtered.length?filtered.map(p=>`
 <div class="person">
  <div><div class="name">${esc(p.name)}</div><div class="debt">${money(p.debt)} TL</div></div>
  <div class="actions"><button class="green" onclick="openModal('${p.id}')">İşlem Yap</button></div>
 </div>`).join(""):'<div class="empty">Henüz müşteri yok. “+ Müşteri Ekle” ile başlayabilirsin.</div>';
}
function esc(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function addPerson(){
 let name=prompt("Müşteri adı:");
 if(!name||!name.trim())return;
 data.push({id:Date.now().toString(),name:name.trim(),debt:0,history:[]});save();
}
function openModal(id){
 selected=data.find(p=>p.id===id); if(!selected)return;
 document.getElementById("modalTitle").textContent=selected.name;
 document.getElementById("modal").classList.add("show"); updateModal();
}
function updateModal(){
 document.getElementById("modalDebt").textContent=money(selected.debt);
 document.getElementById("amount").value="";
 let h=selected.history.slice().reverse();
 document.getElementById("history").innerHTML=h.length?h.map(x=>`<div class="hist"><span class="${x.type==='borc'?'plus':'minus'}">${x.type==='borc'?'+':'-'}${money(x.amount)} TL</span> — ${x.date}</div>`).join(""):"<small>Henüz işlem yok.</small>";
}
function changeDebt(sign){
 let a=parseFloat(document.getElementById("amount").value);
 if(!a||a<=0)return alert("Geçerli bir tutar gir.");
 if(sign<0 && a>selected.debt)return alert("Ödeme, mevcut borçtan fazla olamaz.");
 selected.debt=Math.max(0,selected.debt+sign*a);
 selected.history.push({type:sign>0?"borc":"odeme",amount:a,date:new Date().toLocaleString("tr-TR")});
 save(); updateModal();
}
function renamePerson(){
 let n=prompt("Yeni isim:",selected.name);
 if(n&&n.trim()){selected.name=n.trim();save();document.getElementById("modalTitle").textContent=selected.name}
}
function deletePerson(){
 if(confirm(selected.name+" adlı müşteriyi ve işlem geçmişini silmek istediğine emin misin?")){
  data=data.filter(p=>p.id!==selected.id);closeModal();save();
 }
}
function closeModal(){document.getElementById("modal").classList.remove("show");selected=null}
function backup(){
 let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
 let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="veresiye-yedek-"+new Date().toISOString().slice(0,10)+".json";a.click();
}
function restore(){document.getElementById("file").click()}
function loadBackup(e){
 let f=e.target.files[0];if(!f)return;
 let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d))throw 0;if(confirm("Mevcut kayıtların üzerine yedek yüklensin mi?")){data=d;save();alert("Yedek yüklendi.")}}catch{alert("Geçersiz yedek dosyası.")}};r.readAsText(f);e.target.value="";
}
document.getElementById("search").addEventListener("input",render);
render();
</script>
</body>
</html>
